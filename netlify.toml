# Netlify deploy config for the Next.js configurator.
#
# Why this file exists: @netlify/plugin-nextjs traces server code and, because
# app/api/webhooks/orders-create reads files via
# `path.join(process.cwd(), 'public', <dynamic>)`, the tracer pulls large parts of
# public/ into the ___netlify-server-handler function bundle. That can exceed Netlify's
# function size limit and the deploy fails with
# "could not parse form file: http: request body too large".
#
# `included_files` with leading-"!" globs removes browser-only assets from EVERY function
# bundle. They are still published as static files (served by the CDN; the browser
# fetches them directly). Kept in the bundle: public/models/**/designs/*.{svg,webp}
# and public/svg/** — the webhook's PDF/UV-atlas composer reads those on the server.

[build]
  command = "pnpm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = [
    "!public/models/**/*.glb",
    "!public/models/**/*.gltf",
    "!public/models/**/*.bin",
    "!public/ghostscript/**",
    "!public/png/**",
  ]

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ghostscript/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
