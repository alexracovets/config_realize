# Local parity with Coolify Dockerfile deploy.
# Coolify: use Dockerfile build pack; set the same env vars in the UI.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null "http://127.0.0.1:${PORT:-3000}/api/health" || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
