# Local parity with Coolify Dockerfile deploy.
# Coolify: use Dockerfile build pack; set the same env vars in the UI.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
